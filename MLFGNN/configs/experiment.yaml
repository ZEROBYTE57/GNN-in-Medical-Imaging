# =============================================================================
# Experiment protocol -- centre-aware population graph construction
# =============================================================================
# Everything the leave-one-centre-out benchmark needs. `scripts/02_run_loco.py`
# reads this file; nothing in mlfgnn/ hard-codes a hyper-parameter.
# =============================================================================

run_name: "loco_v1"

data:
  feature_table: "data/processed/features.parquet"
  # Column names expected in the feature table.
  id_col: "patient_id"
  centre_col: "centre"
  time_col: "PFS_time"
  event_col: "PFS_event"
  # Radiomics columns are identified by prefix; everything else that is not a
  # clinical/outcome column is ignored.
  pet_prefix: "PET_"
  ct_prefix: "CT_"
  clinical_cols: ["age", "T_stage", "N_stage", "site"]

# --- Feature selection (fit on TRAIN centres only, every fold, every seed) ---
selection:
  variance_threshold: 0.005
  univariate_repeats: 50          # x n_splits below => 150 Cox fits per feature
  univariate_splits: 3
  top_k_univariate: 50
  spearman_threshold: 0.8
  lasso_cv_folds: 5
  max_features_per_modality: 12   # Peng et al. retain 12 PET + 12 CT

# --- Graph construction ------------------------------------------------------
# The ONLY thing that varies between the three arms of the study.
graphs:
  modes:
    - snf_threshold        # Peng et al. reproduction
    - knn                  # isolates "k-NN vs threshold"
    - centre_balanced_knn  # isolates "centre mixing"  <-- the proposal
  snf:
    k_neighbors: 20        # SNF local affinity neighbourhood
    mu: 0.5                # SNF variance hyper-parameter
    n_iters: 20
    threshold: 0.2         # Peng et al.: retain edges with similarity > 0.2
  knn:
    k_values: [2, 3, 5, 8] # swept; k is the per-centre count for centre_balanced
  symmetrise: "union"      # union | mutual

# --- Model -------------------------------------------------------------------
model:
  layer_types: ["GAT"]     # one of GCN | GraphSAGE | ResGatedGCN | GAT
  fusion: "network"        # network | feature | pet | ct
  hidden_dim: 32
  heads: 4                 # GAT only
  dropout: 0.5
  use_clinical: true

train:
  epochs: 100
  lr: 0.005
  weight_decay: 0.005
  optimizer: "adam"
  # Early stopping on the in-centre validation split (never the held-out centre).
  patience: 30
  min_epochs: 20

# --- Protocol ----------------------------------------------------------------
protocol:
  scheme: "leave_one_centre_out"
  seeds: [0, 1, 2, 3, 4]
  inner_val_fraction: 0.2  # of the training centres, stratified by centre
  eval_times: [12, 24, 60] # months, for time-dependent AUC (as in Peng et al.)

# --- Baselines ---------------------------------------------------------------
baselines:
  - clinical_cox
  - radiomics_coxph
  - cox_nnet
  - rsf

# --- Statistics --------------------------------------------------------------
stats:
  bootstrap_iters: 2000
  alpha: 0.05

output_dir: "results"
